# Dependabot configuration.
#
# The github-actions entry is the important one: every "uses:" in the workflows is
# pinned to a full commit SHA, and this is what keeps those pins current without
# anyone hand-editing them.
#
# Updates are grouped so the required-approval flow stays reviewable.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Aging window for supply-chain safety: hold action bumps until a release
    # has been public long enough for a malicious publish to be caught and
    # yanked. The diffs are reviewed either way because of the SHA pins.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Same idea as the actions entry, tuned per severity: minors and patches
    # ship after three days, majors after two weeks. pnpm enforces a 24-hour
    # release-age floor at install time on top of this (minimumReleaseAge, on
    # by default since pnpm 11), so a bump fresher than the cooldown would
    # fail CI install anyway -- proposing aged versions keeps those PRs green.
    # Security updates skip the cooldown by design.
    cooldown:
      default-days: 3
      semver-major-days: 14
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-development:
        dependency-type: "development"
      npm-production:
        dependency-type: "production"
    # Development-dependency majors that break typecheck/tests are deferred to a
    # dedicated migration round instead of blocking the grouped PR red
    # (@types/node 26 NonSharedBuffer broke typecheck:tests on 2026-10-02).
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
      - dependency-name: "typescript"
        versions: [">=6"]
      - dependency-name: "vitest"
        versions: [">=5"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=5"]
      - dependency-name: "eslint"
        versions: [">=10"]