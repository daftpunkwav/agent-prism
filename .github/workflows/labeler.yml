# Triage pull requests by applying labels based on the files changed
# (configuration: .github/labeler.yml).
#
# Runs on pull_request, not pull_request_target: labels are derived from the
# pull request's own branch context, so an untrusted fork never gets a
# privileged workflow run. sync-labels keeps labels honest when files are
# reverted during review.
name: Labeler

on:
  pull_request:

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
