name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic pnpm store location is not needed; caching keys off the lockfile.
  CI: "true"

# Execution strategy:
#   - PR only: conventions (title), audit (lockfile), review-gate (bot reviews).
#   - PR and push: verify, smoke, gitleaks, and the lint always re-check main
#     itself, whatever the diff was.
#   - Path-routed: the changes job classifies the diff. Docs-only pull requests
#     skip verify/smoke, dependency diffs trigger audit, and .github edits run
#     the workflow lint. Classification is fail-open: an unrecognized path is
#     treated as code, so an unknown file can never sneak past a gate.
#   - gate is the single required status check. It runs last, passes only when
#     every job that ran succeeded, treats skipped jobs as legitimately absent,
#     and fails on cancellation so a cancelled run can never masquerade as
#     green. Adding or removing jobs never touches the branch ruleset.
#
# Neither job needs write access: artifact upload authenticates with its own
# runtime token, so GITHUB_TOKEN stays read-only for checkout and nothing else.
permissions:
  contents: read

jobs:
  # Fastest gate first. The PR title becomes the subject of the squashed merge
  # commit, so it is validated against the commit conventions before anything
  # expensive runs. Dependabot titles are machine-generated and regularly
  # exceed the 72-character budget, so the bot is held to the type prefix only.
  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          pattern='^(Revert(: | "))?(feat|fix|docs|refactor|chore|test|perf)(\([a-z0-9-]+\))?!?: '
          if ! [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "::error title=Invalid PR title::Expected \"<type>(<scope>): <subject>\" with type one of feat/fix/docs/refactor/chore/test/perf"
            exit 1
          fi
          if [[ "$PR_ACTOR" == "dependabot[bot]" ]]; then
            exit 0
          fi
          # Revert titles repeat the original subject plus the Revert marker,
          # so they can legitimately exceed the 72-character budget.
          if [[ "$PR_TITLE" != Revert* && "${#PR_TITLE}" -gt 72 ]]; then
            echo "::error title=PR title too long::${#PR_TITLE}/72 characters; the title becomes the squashed commit subject"
            exit 1
          fi
          subject="${PR_TITLE#*: }"
          if ! [[ "$subject" =~ ^[a-z0-9] ]]; then
            echo "::error title=Invalid PR title::Subject must start with a lowercase letter or digit"
            exit 1
          fi
          if [[ "$subject" == *. ]]; then
            echo "::error title=Invalid PR title::Subject must not end with a period"
            exit 1
          fi

  # Diff classifier feeding the path-routed jobs. On push and dispatch events
  # there is no base to diff against (and main pushes are squashes of already
  # green pull requests), so classify as all-changed and let every gate run.
  # This job must run on every event: the gated jobs depend on it, and a
  # skipped dependency would silently skip its dependents.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.shortcut.outputs.docs_only || steps.classify.outputs.docs_only }}
      deps: ${{ steps.shortcut.outputs.deps || steps.classify.outputs.deps }}
      workflows: ${{ steps.shortcut.outputs.workflows || steps.classify.outputs.workflows }}
    steps:
      - name: Classify as all-changed (push, workflow_dispatch)
        id: shortcut
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "docs_only=false"
            echo "deps=true"
            echo "workflows=true"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          # Full history: the merge base needs both branches' objects.
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the pull request diff
        id: classify
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          docs_only=true
          deps=false
          workflows=false
          while IFS= read -r f; do
            case "$f" in
              # Docs and repo metadata: cannot move build, typecheck, tests,
              # or any other gate.
              *.md|.gitignore|.gitattributes|LICENSE) ;;
              *) docs_only=false ;;
            esac
            case "$f" in
              # Editing the pipeline must never let the pipeline skip itself.
              .github/*) workflows=true ;;
              # Manifest or lockfile moves: audit, and verify reruns too,
              # because the tests now execute against different versions.
              */package.json|package.json|pnpm-lock.yaml|pnpm-workspace.yaml) deps=true ;;
            esac
          done < <(git diff --name-only "$BASE...HEAD")
          {
            echo "docs_only=$docs_only"
            echo "deps=$deps"
            echo "workflows=$workflows"
          } >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only deps=$deps workflows=$workflows"

  # Supply-chain gate over the lockfile: production dependencies with known
  # high or critical advisories block the PR. pnpm audits pnpm-lock.yaml
  # against the registry, so no install is needed. Development-only advisories
  # stay out of scope here; the deferred dev majors are tracked in
  # .github/dependabot.yml instead.
  audit:
    if: github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - run: pnpm audit --prod --audit-level high

  # Bot reviews are a merge precondition with no exemptions: this job waits
  # until both CodeRabbit and Sourcery have reported on the head commit and
  # fails if they have not. The bots signal through three channels depending
  # on the change - a review object pinned to the commit, a check run
  # concluding on it, or a legacy commit status (CodeRabbit reports through
  # the status channel and only re-runs its check on incremental pushes,
  # Sourcery skips the re-review comment on small diffs) - so any of the
  # three counts as "ran". This poll is the single enforcement point for
  # both bots, folded into the gate below.
  review-gate:
    name: bot reviews (CodeRabbit + Sourcery)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Wait for both bots to report on the head commit
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while true; do
            reviews="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
              --jq '.[] | ((.user.login // "") + " " + (.commit_id // ""))' 2>/dev/null || true)"
            checks="$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" \
              --jq '.check_runs[] | (.name // "") + " " + (.conclusion // "")' 2>/dev/null || true)"
            statuses="$(gh api "repos/$REPO/commits/$HEAD_SHA/status" \
              --jq '.statuses[] | (.context // "") + " " + (.state // "")' 2>/dev/null || true)"
            coderabbit=""
            sourcery=""
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              login=${line% *}
              commit=${line#* }
              [ "$commit" = "$HEAD_SHA" ] || continue
              case "${login//\[bot\]/}" in
                coderabbitai*) coderabbit=yes ;;
                sourcery-ai*) sourcery=yes ;;
              esac
            done <<< "$reviews"
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              name=${line% *}
              conclusion=${line#* }
              [ -n "$conclusion" ] || continue
              case "$name" in
                CodeRabbit*) coderabbit=yes ;;
                Sourcery*) sourcery=yes ;;
              esac
            done <<< "$checks"
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              context=${line% *}
              state=${line#* }
              [ "$state" != "pending" ] || continue
              case "$context" in
                CodeRabbit*) coderabbit=yes ;;
                Sourcery*) sourcery=yes ;;
              esac
            done <<< "$statuses"
            if [ -n "$coderabbit" ] && [ -n "$sourcery" ]; then
              echo "CodeRabbit and Sourcery both reported on $HEAD_SHA"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              missing=""
              [ -z "$coderabbit" ] && missing="CodeRabbit"
              [ -z "$sourcery" ] && missing="${missing:+$missing, }Sourcery"
              echo "::error title=Bot reviews missing::No review, check or status from $missing on $HEAD_SHA within 15 minutes. Install the GitHub App(s), then re-run this job or push a new commit."
              exit 1
            fi
            sleep 20
          done

  verify:
    # Windows is the reference platform. The restricted-token sandbox, the
    # process-runner suite, and the PowerShell 5.1 cold-start budgets in
    # vitest.config.ts are Windows-specific: another runner would skip the
    # security-relevant sandbox cases and drop coverage under the gate.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json#packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Environment snapshot, emitted as an annotation because the raw job log
      # cannot be read through the API without repository admin rights.
      - name: Environment
        shell: pwsh
        run: |
          $info = @(
            "node=$(node --version)"
            "pnpm=$(pnpm --version)"
            "SHELL=$env:SHELL"
            "ComSpec=$env:ComSpec"
            "shell-emulator=$(pnpm config get shell-emulator 2>&1)"
            "cwd=$(Get-Location)"
          ) -join ' | '
          Write-Output $info
          Write-Output "::notice title=CI environment::$info"

      # Builds the publishable packages (everything except the two apps), then
      # typechecks packages, apps, and the test projects. Each stage is its own
      # step so a failure names the stage that broke, and the failing tail is
      # re-emitted as an annotation for the same reason as the snapshot above.
      - name: Build packages
        shell: pwsh
        run: |
          $output = pnpm -r build 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $output
          if ($code -ne 0) {
            $tail = (($output -split "`r?`n" | Where-Object { $_.Trim() -ne '' }) | Select-Object -Last 8) -join ' || '
            Write-Output "::error title=Build packages failed::$($tail -replace '%', '%25')"
            exit $code
          }

      - name: Typecheck packages and apps
        shell: pwsh
        run: |
          $output = pnpm -r typecheck 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $output
          if ($code -ne 0) {
            $tail = (($output -split "`r?`n" | Where-Object { $_.Trim() -ne '' }) | Select-Object -Last 8) -join ' || '
            Write-Output "::error title=Typecheck packages and apps failed::$($tail -replace '%', '%25')"
            exit $code
          }

      - name: Typecheck tests
        shell: pwsh
        run: |
          $output = pnpm typecheck:tests 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $output
          if ($code -ne 0) {
            $tail = (($output -split "`r?`n" | Where-Object { $_.Trim() -ne '' }) | Select-Object -Last 8) -join ' || '
            Write-Output "::error title=Typecheck tests failed::$($tail -replace '%', '%25')"
            exit $code
          }

      # Next.js ESLint over the web app (fails on errors; warnings stay advisory).
      - name: Web lint
        run: pnpm --filter @agentprism/web lint

      # Catalog key parity (via the web vitest suite) plus the inline-CJK copy sweep.
      - name: Web i18n gate
        run: pnpm --filter @agentprism/web check:i18n

      # Enforces the coverage thresholds configured in vitest.config.ts.
      - name: Test with coverage
        run: pnpm test:coverage

      - name: Import boundaries
        run: pnpm boundaries

      - name: Dependency hygiene
        run: pnpm check:deps

      # Every callable public export must be referenced by a test harness file.
      - name: Public export test coverage
        run: pnpm check:exports

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: cov-report/
          if-no-files-found: ignore

  # The pipeline audits itself: actionlint catches syntax errors, bad
  # expressions and shellcheck issues in run blocks, zizmor audits the
  # workflows for unsafe expression expansion, excessive permissions and
  # unpinned actions. Both are pinned release binaries, so this adds no
  # third-party action to the supply chain. Runs whenever .github changed.
  workflow-lint:
    name: Workflow lint (actionlint + zizmor)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          curl -sSfL --retry 3 -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint -color .github/workflows/*.yml

      - name: zizmor
        run: |
          set -euo pipefail
          version=1.30.1
          curl -sSfL --retry 3 -o /tmp/zizmor.tar.gz \
            "https://github.com/woodruffw/zizmor/releases/download/v${version}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/zizmor.tar.gz -C /usr/local/bin
          zizmor --persona=pedantic --min-severity=medium .github/workflows/

  # Platform secret scanning covers pushes, but it can be bypassed at push
  # time and it does not gate pull requests. gitleaks scans the full history
  # on every event, so a secret added and removed inside a pull request is
  # still caught. The only allowlist entry is the intentional sk-shaped
  # placeholder used by the provider-catalog masking tests (.gitleaks.toml).
  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret added and removed within a PR must still
          # be caught, which a shallow checkout cannot see.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          V=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt" -o /tmp/checksums.txt
          grep "gitleaks_${V}_linux_x64.tar.gz" /tmp/checksums.txt | sed "s|gitleaks_${V}_linux_x64.tar.gz|/tmp/gitleaks.tgz|" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan full history
        run: /tmp/gitleaks detect --source . --redact --verbose --exit-code 1

  smoke:
    # Boots the real host binary and probes it over HTTP, so the composition root,
    # the listener, and the read contracts are exercised outside the test harness.
    # Needs verify, so it is skipped wherever verify is skipped (docs-only PRs).
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json#packageManager, same as the verify job.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # Boot, probe, and tear down inside a single step. The runner tears down the
      # process tree when a step ends, so a host started in one step is already
      # gone by the next one -- which is exactly how this probe used to fail with
      # "unreachable" while the boot log showed a healthy listener.
      #
      # DRIVERS stays unset so the smoke probe can assert that every builtin
      # backend registered; narrowing it makes that check skip itself.
      - name: Smoke
        shell: pwsh
        run: |
          $env:BACKEND_HOST = "127.0.0.1"
          $env:BACKEND_PORT = "8291"
          $env:SMOKE_PORT = "8291"
          $env:SMOKE_TIMEOUT_MS = "60000"

          $proc = Start-Process -FilePath "node" `
            -ArgumentList "apps/server/dist/main.js" `
            -RedirectStandardOutput "server.log" `
            -RedirectStandardError "server.err.log" `
            -NoNewWindow -PassThru

          $code = 1
          try {
            $output = node scripts/smoke.mjs 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Output $output
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }

            $parts = @()
            foreach ($pair in @(@('server.log', 'STDOUT'), @('server.err.log', 'STDERR'))) {
              if (Test-Path $pair[0]) {
                $body = (((Get-Content $pair[0] -Raw) -replace "`r?`n", " | ")).Trim()
                if ($body -ne '') { $parts += "$($pair[1]): $body" }
              }
            }
            if ($parts.Count -eq 0) { $parts += "no server log files in $(Get-Location)" }
            $joined = $parts -join ' ### '
            if ($joined.Length -gt 1200) { $joined = $joined.Substring(0, 1200) }
            Write-Output "--- server logs ---"
            Write-Output $joined

            # Re-emitted as an annotation: the raw job log needs repository admin
            # rights to read through the API, annotations do not.
            if ($code -ne 0) {
              Write-Output "::error title=Server logs::$($joined -replace '%', '%25')"
            }
          }

          if ($code -ne 0) {
            Write-Output "::error title=Smoke failed::exit code $code"
            exit $code
          }

  # Merge-time summary: the branch ruleset requires exactly this check. It
  # always runs, passes when every job that ran succeeded (skipped areas are
  # the path filtering above working as intended) and fails on any failure or
  # cancellation, so a cancelled run can never masquerade as green.
  gate:
    name: gate
    needs: [conventions, changes, audit, review-gate, verify, workflow-lint, secrets, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Evaluate gate results
        env:
          CONVENTIONS: ${{ needs.conventions.result }}
          CHANGES: ${{ needs.changes.result }}
          AUDIT: ${{ needs.audit.result }}
          REVIEW_GATE: ${{ needs.review-gate.result }}
          VERIFY: ${{ needs.verify.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          SECRETS: ${{ needs.secrets.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          set -euo pipefail
          results="conventions=$CONVENTIONS changes=$CHANGES audit=$AUDIT review_gate=$REVIEW_GATE verify=$VERIFY workflow_lint=$WORKFLOW_LINT gitleaks=$SECRETS smoke=$SMOKE"
          echo "$results"
          if grep -qE '=(failure|cancelled)' <<< "$results"; then
            echo "::error::one or more gates failed or were cancelled"
            exit 1
          fi
          echo "all triggered gates passed (skipped areas excluded)"
