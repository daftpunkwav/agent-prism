packages:
  - "apps/*"
  - "packages/*/*"

allowBuilds:
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.283'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.283'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.283'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.283'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.283'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.283'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.283'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.283'
  - '@anthropic-ai/claude-agent-sdk@0.3.283'

onlyBuiltDependencies:
  - sharp
  - unrs-resolver

# The Claude Agent SDK ships one ~245 MB native CLI per platform as an optional
# dependency. The driver runs a Claude Code CLI that is already installed on the
# host instead (ARENA_CLAUDE_CODE_PATH, else a globally installed Claude Code),
# so those downloads are skipped: they are slow, fail intermittently, and would
# be paid on every CI install. Remove an entry to get the bundled binary back.
ignoredOptionalDependencies:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl'
  - '@anthropic-ai/claude-agent-sdk-linux-x64'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64'
  - '@anthropic-ai/claude-agent-sdk-win32-x64'

# Accepted advisories (pnpm's native audit ignore). GHSA-vfj7-8cjw-p6xm
# (CVE-2026-93687, high, braces stack-exhaustion DoS on deeply nested
# patterns) has no patched release - braces@3.0.3 is the latest - and both
# micromatch consumers keep requiring it, so it cannot be dropped from the
# tree. Arrival paths: the web lint toolchain (dev; fast-glob over repo-owned
# config) and, in production, the Deep Agents driver - the framework's glob
# tool (pattern arg) and grep tool (glob filter) hand model-supplied patterns
# to micromatch -> braces, including from delegated subagents. Those are the
# only request-controlled inputs to the matcher, and the driver rejects
# over-complex ones in the framework's error-result shape before any matcher
# runs: GuardedFilesystemBackend (driver-deepagents) guards the one backend
# instance deepagents shares between the root agent and every generated
# subagent, because root custom middleware is not merged into subagents and
# a middleware-level guard would not cover delegation. Bounds: <= 1024 chars,
# <= 32 brace-nesting depth, <= 1024 brace expansions (sequential groups
# multiply, alternatives add; escaped braces are not structure). Re-check on
# any braces, micromatch, deepagents, or eslint-config-next bump, and if the
# guard no longer covers the framework's pattern entry points. See also
# scripts/ci/dependency-policy.json for the never-wanted-package denylist.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

# Security floors over transitive pins (pnpm overrides). Both patched releases
# predate the 24-hour minimumReleaseAge floor by days, so resolution is
# unaffected; the floors only lift two high advisories that the declaring
# packages' ranges do not reach on their own:
# - sharp >=0.35.5 (GHSA-wq5f-xc86-pv6w, high): vulnerability in a librsvg
#   dependency of the prebuilt binaries; arrives through next's optional
#   dependency in apps/web (image optimization is the only consumer).
# - @modelcontextprotocol/client >=2.2.0 (GHSA-6qxp-vccf-f47h, high): OAuth
#   client could send credentials to an authorization server chosen by the
#   MCP server; arrives via @openai/agents-core in the openai-agents driver.
# Re-check both floors on any next or @openai/agents bump, and drop them once
# the declaring packages reach the patched ranges on their own.
overrides:
  sharp: ">=0.35.5"
  '@modelcontextprotocol/client': ">=2.2.0"
