packages:
  - "apps/*"
  - "packages/*/*"

allowBuilds:
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.283'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.283'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.283'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.283'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.283'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.283'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.283'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.283'
  - '@anthropic-ai/claude-agent-sdk@0.3.283'

onlyBuiltDependencies:
  - sharp
  - unrs-resolver

# The Claude Agent SDK ships one ~245 MB native CLI per platform as an optional
# dependency. The driver runs a Claude Code CLI that is already installed on the
# host instead (ARENA_CLAUDE_CODE_PATH, else a globally installed Claude Code),
# so those downloads are skipped: they are slow, fail intermittently, and would
# be paid on every CI install. Remove an entry to get the bundled binary back.
ignoredOptionalDependencies:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl'
  - '@anthropic-ai/claude-agent-sdk-linux-x64'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64'
  - '@anthropic-ai/claude-agent-sdk-win32-x64'

# Accepted advisories (pnpm's native audit ignore). GHSA-vfj7-8cjw-p6xm
# (CVE-2026-93687, high, braces stack-exhaustion DoS on deeply nested
# patterns) has no patched release - braces@3.0.3 is the latest - and both
# micromatch consumers keep requiring it, so it cannot be dropped from the
# tree. Arrival paths: the web lint toolchain (dev; fast-glob over repo-owned
# config) and, in production, the Deep Agents driver - the framework's glob
# tool (pattern arg) and grep tool (glob filter) hand model-supplied patterns
# to micromatch -> braces. Those are the only request-controlled inputs to
# the matcher, and the driver rejects over-complex ones with a ToolMessage
# before any matcher runs (createPatternGuardMiddleware in driver-langchain:
# <= 1024 chars, <= 32 brace-nesting depth). Re-check on any braces,
# micromatch, deepagents, or eslint-config-next bump, and if the guard is
# ever removed or loosened. See also scripts/ci/dependency-policy.json for
# the never-wanted-package denylist.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
