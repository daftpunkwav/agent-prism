# Triage pull requests by applying labels based on the files changed
# (configuration: .github/labeler.yml).
#
# pull_request_target is the trigger the actions/labeler documentation
# prescribes for fork support: the run executes in the base repository with
# a write token, but the labeler only reads the changed-file list through
# the API and writes labels - it never checks out or executes pull-request
# code, so untrusted forks stay safe. sync-labels keeps labels honest when
# files are reverted during review.
name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
