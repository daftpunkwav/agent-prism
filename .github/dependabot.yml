# Dependabot configuration.
#
# The github-actions entry is the important one: every "uses:" in the workflows is
# pinned to a full commit SHA, and this is what keeps those pins current without
# anyone hand-editing them.
#
# Updates are grouped so the required-approval flow stays reviewable.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-development:
        dependency-type: "development"
      npm-production:
        dependency-type: "production"
    # Development-dependency majors that break typecheck/tests are deferred to a
    # dedicated migration round instead of blocking the grouped PR red
    # (@types/node 26 NonSharedBuffer broke typecheck:tests on 2026-10-02).
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
      - dependency-name: "typescript"
        versions: [">=6"]
      - dependency-name: "vitest"
        versions: [">=5"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=5"]
      - dependency-name: "eslint"
        versions: [">=10"]