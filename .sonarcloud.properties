# SonarCloud analysis scope for the auto-imported project (no CI-side scan).
# The bilingual i18n catalogs are key-symmetric by design (the en overlay must
# mirror the zh-CN key tree exactly — enforced by apps/web's check-i18n gate),
# so Sonar's token-level duplication detection flags the pair as ~52 duplicated
# lines and pushes the PR's new_duplicated_lines_density over the 3% gate.
# Duplication across translations is the mechanism, not a defect.
sonar.cpd.exclusions=apps/web/src/i18n/catalogs/**/*.ts
